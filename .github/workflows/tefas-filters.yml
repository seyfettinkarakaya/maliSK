name: TEFAS tür filtresi denemesi

# TEFAS veri isteğindeki tür filtrelerini dener; katılım sınıflamasını arar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/tefas_filters.mjs
      - .github/workflows/tefas-filters.yml

permissions:
  contents: write

concurrency:
  group: tefas-filters
  cancel-in-progress: false

jobs:
  filters:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/tefas_filters.mjs
      - name: Sonucu depoya yaz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/tefas_filters.md || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "TEFAS tür filtresi sonuçları"
            git pull --rebase origin main
            git push
          fi
