name: F0 veri denemesi

# TEFAS, EVDS ve FRED'e canlı istek atar; docs/data_fields.md dosyasını üretip depoya yazar.
# Actions sekmesinden "Run workflow" ile ya da tools/probe.py değişince çalışır.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/probe.py
      - .github/workflows/probe.yml

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe.py
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Sonuçları depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "F0: canlı veri denemesi sonuçları"
            git push
          fi
