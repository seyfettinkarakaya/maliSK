name: Veri kaynağı denemesi

# Yalnız elle çalışır. Kaynaklara az sayıda istek atar, sonucu loga ve özete yazar; depoya bir şey yazmaz.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Çalışacak deneme betiği"
        type: choice
        options: [probe-sources, probe-sources2, probe-raw]
        default: probe-sources

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kaynakları dene
        env:
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: node scripts/${{ inputs.script || 'probe-sources' }}.mjs
